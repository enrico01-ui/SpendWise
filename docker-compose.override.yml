services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendwise}
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://spendwise:spendwise@db:5432/spendwise?schema=public}
      API_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development-32-chars}
    ports:
      - "${API_HOST_PORT:-3000}:3000"

  ocr:
    environment:
      OCR_PORT: ${OCR_PORT:-8000}

  web:
    build:
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
