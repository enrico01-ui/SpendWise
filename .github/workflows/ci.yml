name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and database migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: spendwise
          POSTGRES_DB: spendwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendwise -d spendwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci --include=optional

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migration
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://spendwise:spendwise@localhost:5432/spendwise_test?schema=public

      - name: Run API tests
        run: npm test

      - name: Build API
        run: npm run build

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --include=optional

      - name: Install Rollup Linux binary
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.68.3

      - name: Build web
        run: npm run build

  ocr:
    name: OCR tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ocr/requirements-dev.txt

      - name: Install OCR test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run OCR tests
        run: python -m pytest

  docker:
    name: Docker Compose build and smoke test
    runs-on: ubuntu-latest
    needs: [api, web, ocr]
    env:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
      POSTGRES_DB: spendwise
      DATABASE_URL: postgresql://spendwise:spendwise@db:5432/spendwise?schema=public
      API_HOST_PORT: "3000"
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build service images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Check service health endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health >/dev/null &&
               docker compose exec -T ocr python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down -v
