services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendwise}
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://spendwise:spendwise@db:5432/spendwise?schema=public}
      API_PORT: ${API_PORT:-3000}
      OCR_URL: http://ocr:8000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-development}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-development}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm run start"

  ocr:
    build:
      context: ./ocr
    environment:
      OCR_PORT: ${OCR_PORT:-8000}
    ports:
      - "${OCR_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:

