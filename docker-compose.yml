services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: 3000
      OCR_URL: http://ocr:8000
      WORKER_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${API_HOST_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm run start"

  ocr:
    build:
      context: ./ocr
    environment:
      OCR_PORT: ${OCR_PORT:-8000}
    volumes:
      - uploads:/app/uploads
      - ./data:/app/data:ro
      - ./eval-results:/app/eval-results

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:

